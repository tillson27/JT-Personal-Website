name: Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION: ca-central-1
  S3_BUCKET: joshtillson.com
  # Updated by setup-aws.sh — replace if you recreate the distribution
  CLOUDFRONT_DISTRIBUTION_ID: E1ALISDHVKHCI5

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_PUBLIC_POSTHOG_KEY: phc_ob5PvWCnJA8zuEppeCvYzzxvJeHnESjteJ9gipF9fKVE
          VITE_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::985090322161:role/github-actions-jt-personal-website-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist/ s3://${{ env.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
